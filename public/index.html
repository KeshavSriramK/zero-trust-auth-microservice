<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero-Trust Authentication System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Secure Sign In</h2>
      <p class="subtitle">Zero-Trust Authentication Gateway</p>
      
      <div id="alert-box" class="alert hidden" role="alert" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••••••" autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn">
          <span class="btn-text">Authenticate</span>
          <span class="spinner hidden"></span>
        </button>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
