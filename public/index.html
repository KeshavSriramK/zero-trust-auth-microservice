<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Trust Authentication Gateway</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Zero-Trust Access Control</h2>
        
        <div id="alert-box" class="alert hidden"></div>

        <form id="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="user@domain.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••••••">
            </div>

            <div class="button-group">
                <button type="button" id="btn-login" class="btn primary">Sign In</button>
                <button type="button" id="btn-register" class="btn secondary">Register</button>
            </div>
        </form>

        <div id="profile-card" class="profile-card hidden">
            <h3>Session Info</h3>
            <p><strong>User ID:</strong> <span id="user-id"></span></p>
            <p><strong>Email:</strong> <span id="user-email"></span></p>
            <p><strong>Role:</strong> <span id="user-role"></span></p>
            <button id="btn-logout" class="btn danger">Sign Out</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
